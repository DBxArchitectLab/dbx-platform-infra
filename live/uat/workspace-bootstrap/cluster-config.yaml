clusters:
  personal-dbx:
    policy_name: Personal Compute
    spark_version: 15.4.x-scala2.12
    node_type_id: Standard_D4ds_v5
    num_workers: 0
    data_security_mode: SINGLE_USER
    runtime_engine: STANDARD
    autotermination_minutes: 240
    single_user_name: dbxarchitectlab@gmail.com
    spark_conf:
      spark.databricks.cluster.profile: singleNode
    azure_attributes:
      availability: ON_DEMAND_AZURE
    custom_tags:
      workload: personal-dev
      bootstrap: "true"

  shared-analytics:
    policy_name: Shared Compute
    spark_version: 15.4.x-scala2.12
    node_type_id: Standard_D8ds_v5
    data_security_mode: USER_ISOLATION
    autotermination_minutes: 120
    autoscale:
      min_workers: 2
      max_workers: 10
    azure_attributes:
      availability: ON_DEMAND_AZURE
    custom_tags:
      workload: shared-analytics
      bootstrap: "true"

  power-user-analytics:
    policy_name: Power User Compute
    spark_version: 15.4.x-scala2.12
    node_type_id: Standard_D4ds_v5
    data_security_mode: USER_ISOLATION
    autotermination_minutes: 120
    autoscale:
      min_workers: 2
      max_workers: 10
    azure_attributes:
      availability: ON_DEMAND_AZURE
    custom_tags:
      workload: power-user
      bootstrap: "true"

  shared-analytics-custom:
    policy_name: shared_compute_customize
    node_type_id: Standard_D4s_v3
    data_security_mode: USER_ISOLATION
    autotermination_minutes: 120
    autoscale:
      min_workers: 1
      max_workers: 1
    azure_attributes:
      availability: ON_DEMAND_AZURE
    custom_tags:
      workload: shared-analytics-custom
      bootstrap: "true"