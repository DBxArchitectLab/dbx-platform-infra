name: Terragrunt Deploy Stacks

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to deploy
        type: choice
        required: true
        options:
          - metastore
          - dev-dbxarchitectlab-workspace
          - dev-dbxarchitectlab-workspace-bootstrap
          - uat-dbxarchitectlab-workspace
          - uat-dbxarchitectlab-workspace-bootstrap
          - prod-dbxarchitectlab-workspace
          - prod-dbxarchitectlab-workspace-bootstrap
      action:
        description: Terragrunt action
        type: choice
        required: true
        default: plan
        options:
          - validate
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

jobs:
  terragrunt:
    runs-on: ubuntu-latest
    # prod-* and uat-* stacks use the matching GitHub environment; all others use "dev".
    environment: ${{ startsWith(inputs.stack, 'prod-') && 'prod' || startsWith(inputs.stack, 'uat-') && 'uat' || 'dev' }}
    # Required secrets (GitHub environment or repository secrets):
    #   SP_CLIENT_ID            - deployment service principal's application (client) ID, not its object ID
    #   SP_CLIENT_SECRET        - client secret value for that service principal
    #   AZURE_TENANT_ID         - Entra ID tenant (directory) ID
    #   AZURE_SUBSCRIPTION_ID   - target Azure subscription; also hosts the Terraform state
    #   DATABRICKS_ACCOUNT_ID   - Databricks account ID (account console, user menu)
    #   DATABRICKS_METASTORE_ID - Unity Catalog metastore assigned to the workspaces
    env:
      TG_NON_INTERACTIVE: "true"
      # ARM_* are read by the azurerm provider, the azurerm state backend and the Databricks
      # account-level provider.
      ARM_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Read by live/*/env.hcl and live/*/workspace/terragrunt.hcl via get_env().
      DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      DATABRICKS_METASTORE_ID: ${{ secrets.DATABRICKS_METASTORE_ID }}
      # Deployment service principal, granted on the catalog and external location by workspace-bootstrap.
      DEPLOY_SP_APPLICATION_ID: ${{ secrets.SP_CLIENT_ID }}
      # Terraform state backend; must match remote_state in live/root.hcl.
      TF_STATE_STORAGE_ACCOUNT: adlsdbxarchitectlab
      TF_STATE_RESOURCE_GROUP: rg-dbx-architect-lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Signs in the Azure CLI with GitHub OIDC (no secret). Needs a federated credential on the
      # service principal for this GitHub environment. The CLI session is used by the firewall steps
      # and by the workspace-level Databricks provider (auth_type = "azure-cli").
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6

      - name: Install Terragrunt
        shell: bash
        run: |
          set -euo pipefail
          TG_VERSION="0.99.4"
          curl -sSL -o terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt
          terragrunt --version

      - name: Resolve stack path
        id: stack
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.stack }}" in
            metastore) echo "path=live/metastore" >> "$GITHUB_OUTPUT" ;;
            dev-dbxarchitectlab-workspace) echo "path=live/dev/workspace" >> "$GITHUB_OUTPUT" ;;
            dev-dbxarchitectlab-workspace-bootstrap) echo "path=live/dev/workspace-bootstrap" >> "$GITHUB_OUTPUT" ;;
            uat-dbxarchitectlab-workspace) echo "path=live/uat/workspace" >> "$GITHUB_OUTPUT" ;;
            uat-dbxarchitectlab-workspace-bootstrap) echo "path=live/uat/workspace-bootstrap" >> "$GITHUB_OUTPUT" ;;
            prod-dbxarchitectlab-workspace) echo "path=live/prod/workspace" >> "$GITHUB_OUTPUT" ;;
            prod-dbxarchitectlab-workspace-bootstrap) echo "path=live/prod/workspace-bootstrap" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported stack: ${{ inputs.stack }}"; exit 1 ;;
          esac

      - name: Debug Azure runtime identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Selected stack path: ${{ steps.stack.outputs.path }}"
          echo "Workflow ref: ${GITHUB_REF}"
          echo "ARM_CLIENT_ID=${ARM_CLIENT_ID}"
          echo "ARM_TENANT_ID=${ARM_TENANT_ID}"
          echo "ARM_SUBSCRIPTION_ID=${ARM_SUBSCRIPTION_ID}"
          az account show --query "{tenantId:tenantId,subscriptionId:id,user:user}" -o json

      - name: Allowlist runner IP on state storage account
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "Runner IP: $RUNNER_IP"
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"

          az storage account network-rule add \
            --account-name "$TF_STATE_STORAGE_ACCOUNT" \
            --resource-group "$TF_STATE_RESOURCE_GROUP" \
            --subscription "$ARM_SUBSCRIPTION_ID" \
            --ip-address "$RUNNER_IP" \
            --output none

          echo "Waiting for firewall rule to propagate..."
          sleep 30

          FOUND=$(az storage account network-rule list \
            --account-name "$TF_STATE_STORAGE_ACCOUNT" \
            --resource-group "$TF_STATE_RESOURCE_GROUP" \
            --subscription "$ARM_SUBSCRIPTION_ID" \
            --query "ipRules[?ipAddressOrRange=='$RUNNER_IP'] | length(@)" \
            --output tsv)
          if [ "$FOUND" = "1" ]; then
            echo "Verified: runner IP $RUNNER_IP added to storage account firewall."
          else
            echo "::error::Runner IP $RUNNER_IP not confirmed in firewall rules."
            exit 1
          fi

      - name: Terragrunt init
        working-directory: ${{ steps.stack.outputs.path }}
        shell: bash
        run: |
          set -o pipefail
          terragrunt init -upgrade 2>&1 | tee terragrunt-init.log

      - name: Terragrunt validate
        if: ${{ inputs.action == 'validate' }}
        working-directory: ${{ steps.stack.outputs.path }}
        shell: bash
        run: |
          set -o pipefail
          terragrunt validate -no-color 2>&1 | tee terragrunt-validate.log

      - name: Terragrunt plan
        if: ${{ inputs.action == 'plan' }}
        working-directory: ${{ steps.stack.outputs.path }}
        shell: bash
        run: |
          set -o pipefail
          terragrunt plan -no-color 2>&1 | tee terragrunt-plan.log

      - name: Terragrunt apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ steps.stack.outputs.path }}
        shell: bash
        run: |
          set -o pipefail
          terragrunt apply -auto-approve -no-color 2>&1 | tee terragrunt-apply.log

      - name: Terragrunt destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ${{ steps.stack.outputs.path }}
        shell: bash
        run: |
          set -o pipefail
          terragrunt destroy -auto-approve -no-color 2>&1 | tee terragrunt-destroy.log

      - name: Upload Terragrunt logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terragrunt-logs-${{ inputs.stack }}-${{ github.run_id }}
          path: |
            ${{ steps.stack.outputs.path }}/terragrunt-init.log
            ${{ steps.stack.outputs.path }}/terragrunt-validate.log
            ${{ steps.stack.outputs.path }}/terragrunt-plan.log
            ${{ steps.stack.outputs.path }}/terragrunt-apply.log
            ${{ steps.stack.outputs.path }}/terragrunt-destroy.log
          if-no-files-found: ignore

      - name: Remove runner IP from state storage account
        if: always() && env.RUNNER_IP != ''
        shell: bash
        run: |
          az storage account network-rule remove \
            --account-name "$TF_STATE_STORAGE_ACCOUNT" \
            --resource-group "$TF_STATE_RESOURCE_GROUP" \
            --subscription "$ARM_SUBSCRIPTION_ID" \
            --ip-address "$RUNNER_IP" \
            --output none

          FOUND=$(az storage account network-rule list \
            --account-name "$TF_STATE_STORAGE_ACCOUNT" \
            --resource-group "$TF_STATE_RESOURCE_GROUP" \
            --subscription "$ARM_SUBSCRIPTION_ID" \
            --query "ipRules[?ipAddressOrRange=='$RUNNER_IP'] | length(@)" \
            --output tsv)
          if [ "$FOUND" = "0" ]; then
            echo "Verified: runner IP $RUNNER_IP removed from storage account firewall."
          else
            echo "::warning::Runner IP $RUNNER_IP may still be present in firewall rules."
          fi
