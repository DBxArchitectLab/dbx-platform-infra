name: Terragrunt Deploy Stacks
run-name: ${{ inputs.action }} ${{ inputs.stack }} (@${{ github.actor }})

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to deploy
        type: choice
        required: true
        options:
          - metastore
          - dev-dbxarchitectlab-workspace
          - dev-dbxarchitectlab-workspace-bootstrap
          - uat-dbxarchitectlab-workspace
          - uat-dbxarchitectlab-workspace-bootstrap
          - prod-dbxarchitectlab-workspace
          - prod-dbxarchitectlab-workspace-bootstrap
      action:
        description: Terragrunt action
        type: choice
        required: true
        default: plan
        options:
          - validate
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

jobs:
  terragrunt:
    runs-on: ubuntu-latest
    # prod-* and uat-* stacks use the matching GitHub environment; all others use "dev".
    environment: ${{ startsWith(inputs.stack, 'prod-') && 'prod' || startsWith(inputs.stack, 'uat-') && 'uat' || 'dev' }}
    # Required secrets (GitHub environment or repository secrets):
    #   SP_CLIENT_ID            - deployment service principal's application (client) ID, not its object ID
    #   SP_CLIENT_SECRET        - client secret value for that service principal
    #   AZURE_TENANT_ID         - Entra ID tenant (directory) ID
    #   AZURE_SUBSCRIPTION_ID   - target Azure subscription; also hosts the Terraform state
    #   DATABRICKS_ACCOUNT_ID   - Databricks account ID (account console, user menu)
    #   DATABRICKS_METASTORE_ID - Unity Catalog metastore assigned to the workspaces
    env:
      STACK: ${{ inputs.stack }}
      ACTION: ${{ inputs.action }}
      # Same expression as "environment" above; there is no context that exposes the job's environment.
      DEPLOY_ENVIRONMENT: ${{ startsWith(inputs.stack, 'prod-') && 'prod' || startsWith(inputs.stack, 'uat-') && 'uat' || 'dev' }}
      TG_NON_INTERACTIVE: "true"
      # ARM_* are read by the azurerm provider, the azurerm state backend and the Databricks
      # account-level provider.
      ARM_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Read by live/*/env.hcl and live/*/workspace/terragrunt.hcl via get_env().
      DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      DATABRICKS_METASTORE_ID: ${{ secrets.DATABRICKS_METASTORE_ID }}
      # Deployment service principal, granted on the catalog and external location by workspace-bootstrap.
      DEPLOY_SP_APPLICATION_ID: ${{ secrets.SP_CLIENT_ID }}
      # Terraform state backend; must match remote_state in live/root.hcl.
      TF_STATE_STORAGE_ACCOUNT: adlsdbxarchitectlab
      TF_STATE_RESOURCE_GROUP: rg-dbx-architect-lab
      TERRAGRUNT_VERSION: "0.99.4"

    # Explicit bash runs with -eo pipefail, so a failing command before "| tee" still fails the step.
    defaults:
      run:
        shell: bash

    steps:
      - name: Show deployment selection
        id: stack
        run: |
          case "$STACK" in
            metastore)                 path=live/metastore ;;
            *-workspace-bootstrap)     path=live/${STACK%%-*}/workspace-bootstrap ;;
            *-workspace)               path=live/${STACK%%-*}/workspace ;;
            *) echo "::error::Unsupported stack: $STACK"; exit 1 ;;
          esac
          echo "path=$path" >> "$GITHUB_OUTPUT"

          {
            echo "### Terragrunt ${ACTION}: ${STACK}"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Action | \`${ACTION}\` |"
            echo "| Stack | \`${STACK}\` |"
            echo "| Path | \`${path}\` |"
            echo "| GitHub environment | \`${DEPLOY_ENVIRONMENT}\` |"
            echo "| Ref | \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA::7}\`) |"
            echo "| Started by | @${GITHUB_ACTOR} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [[ "$ACTION" == "apply" || "$ACTION" == "destroy" ]]; then
            echo "::warning title=${ACTION}::This run will ${ACTION} ${STACK} without a further approval prompt."
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      # Signs in the Azure CLI with GitHub OIDC (no secret). Needs a federated credential on the
      # service principal for this GitHub environment. The CLI session is used by the firewall steps
      # and by the workspace-level Databricks provider (auth_type = "azure-cli").
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6
          # The wrapper rewrites terraform's stdout, which Terragrunt reads.
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          curl -fsSL -o terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          sudo install -m 0755 terragrunt /usr/local/bin/terragrunt
          rm terragrunt
          terragrunt --version

      - name: Allow runner IP on state storage firewall
        run: |
          RUNNER_IP=$(curl -fsS --max-time 10 https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          az storage account network-rule add \
            --account-name "$TF_STATE_STORAGE_ACCOUNT" \
            --resource-group "$TF_STATE_RESOURCE_GROUP" \
            --subscription "$ARM_SUBSCRIPTION_ID" \
            --ip-address "$RUNNER_IP" \
            --output none
          echo "Allowed $RUNNER_IP; waiting 30s for the rule to take effect."
          sleep 30

      - name: Terragrunt init
        working-directory: ${{ steps.stack.outputs.path }}
        run: terragrunt init -upgrade -no-color 2>&1 | tee terragrunt-init.log

      - name: Terragrunt ${{ inputs.action }}
        working-directory: ${{ steps.stack.outputs.path }}
        run: |
          args=(-no-color)
          [[ "$ACTION" == "apply" || "$ACTION" == "destroy" ]] && args+=(-auto-approve)
          terragrunt "$ACTION" "${args[@]}" 2>&1 | tee "terragrunt-$ACTION.log"

      - name: Upload Terragrunt logs
        if: always() && steps.stack.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: terragrunt-logs-${{ inputs.stack }}-${{ github.run_id }}
          path: ${{ steps.stack.outputs.path }}/terragrunt-*.log
          if-no-files-found: ignore

      - name: Remove runner IP from state storage firewall
        if: always() && env.RUNNER_IP != ''
        run: |
          az storage account network-rule remove \
            --account-name "$TF_STATE_STORAGE_ACCOUNT" \
            --resource-group "$TF_STATE_RESOURCE_GROUP" \
            --subscription "$ARM_SUBSCRIPTION_ID" \
            --ip-address "$RUNNER_IP" \
            --output none
